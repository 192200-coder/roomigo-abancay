spring.application.name=roomix-api
server.port=${PORT:8081}

# Variables locales desde api/.env (opcional; en Render se usan variables de entorno).
# Ver api/.env.example. El archivo .env está ignorado por git.
spring.config.import=optional:file:.env[.properties],optional:file:api/.env[.properties]

# ===================================================================
# BASE DE DATOS POSTGRESQL LOCAL
# Supabase queda fuera de este entorno; se puede sobrescribir mediante variables.
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/roomix_db}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Pool de conexiones PostgreSQL
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# ===================================================================
# JPA & HIBERNATE
# ===================================================================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# MIGRACIONES (FLYWAY)
# El esquema lo gestiona Flyway (src/main/resources/db/migration); Hibernate solo valida.
# baseline-on-migrate: en una base existente sin historial (Supabase) registra V1 como
# línea base sin ejecutarla; en una base vacía (local) ejecuta V1 completo.
# ===================================================================
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ===================================================================
# SEGURIDAD Y TOKEN JWT
# ===================================================================
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=86400000

# ===================================================================
# OPENAPI & SWAGGER UI
# ===================================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ===================================================================
# SERVICIO DE CORREO ELECTRÓNICO (SMTP GMAIL / REAL)
# ===================================================================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:codearcadia.roomix@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
