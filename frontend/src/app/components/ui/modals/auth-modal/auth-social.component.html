@if (app.showSocialModal(); as isOpen) {
  <div class="modal-backdrop" (click)="app.closeSocialModal()">
    <div class="modal-dialog modal-auth-dialog modal-google-dialog animate-scale-up"
      (click)="$event.stopPropagation()">
      <button class="modal-close" (click)="app.closeSocialModal()"><i class="fa-solid fa-xmark"></i></button>

      <!-- Google Brand Header -->
      <div class="google-auth-header">
        <div class="google-logo-wrapper">
          <svg class="google-icon-svg" viewBox="0 0 24 24" width="36" height="36">
            <path fill="#4285F4"
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
            <path fill="#34A853"
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
            <path fill="#FBBC05"
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
            <path fill="#EA4335"
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
          </svg>
        </div>
        <h3 class="google-auth-title">Acceder con Google</h3>
        <p class="google-auth-subtitle">Para continuar a <strong>RoomiGo Abancay</strong></p>
      </div>

      <div class="modal-body google-modal-body">
        @if (app.socialError) {
        <div class="auth-error-box animate-fade-in">
          <i class="fa-solid fa-triangle-exclamation"></i> {{ app.socialError }}
        </div>
        }

        <!-- Selector de Rol para la cuenta Google -->
        <div class="form-group auth-field-group mb-4">
          <label class="form-label text-xs uppercase tracking-wider text-slate-500 font-semibold mb-2">Selecciona tu Perfil:</label>
          <div class="role-selector-cards role-selector-2">
            <label class="role-card" [class.selected]="app.socialRole === 'ROLE_TENANT'">
              <input type="radio" name="googleRole" value="ROLE_TENANT" [(ngModel)]="app.socialRole">
              <i class="fa-solid fa-person-shelter"></i>
              <span>Inquilino</span>
              <small>Busco alquilar cuarto</small>
            </label>

            <label class="role-card" [class.selected]="app.socialRole === 'ROLE_OWNER'">
              <input type="radio" name="googleRole" value="ROLE_OWNER" [(ngModel)]="app.socialRole">
              <i class="fa-solid fa-key"></i>
              <span>Propietario</span>
              <small>Publicar cuartos</small>
            </label>
          </div>
        </div>

        <!-- Ingreso seguro de cuenta Google -->
        <div class="google-custom-account-box animate-fade-in">
          <div class="form-row auth-names-grid mb-2">
            <div class="form-group auth-field-group">
              <input type="text" class="form-input text-sm" [(ngModel)]="app.socialFirstName"
                autocomplete="given-name" placeholder="Nombre (ej. Juan)">
            </div>
            <div class="form-group auth-field-group">
              <input type="text" class="form-input text-sm" [(ngModel)]="app.socialLastName"
                autocomplete="family-name" placeholder="Apellido (ej. Pérez)">
            </div>
          </div>
          <div class="form-group auth-field-group mb-3">
            <div class="input-with-icon">
              <i class="fa-regular fa-envelope"></i>
              <input type="email" class="form-input text-sm" [(ngModel)]="app.socialEmail"
                autocomplete="email" placeholder="tu-correo@gmail.com">
            </div>
          </div>
          <button type="button" class="btn btn-outline btn-block btn-sm google-connect-btn"
            [disabled]="app.socialLoading || !app.socialEmail"
            (click)="app.selectGoogleAccount(app.socialEmail, (app.socialFirstName + ' ' + app.socialLastName).trim(), app.socialRole)">
            @if (app.socialLoading) {
            <i class="fa-solid fa-spinner fa-spin"></i> Conectando con Google...
            } @else {
            <i class="fa-brands fa-google text-rose-500"></i> Acceder con cuenta de Google
            }
          </button>
        </div>

        <div class="google-privacy-footer">
          <p>
            Al continuar, Google compartirá tu nombre, correo electrónico y foto de perfil con <strong>RoomiGo Abancay</strong>. Consulta nuestra <a href="javascript:void(0)">Política de Privacidad</a>.
          </p>
        </div>
      </div>
    </div>
  </div>
  }
