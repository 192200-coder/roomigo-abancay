<!-- =========================================================================
     MODAL: ELIMINAR ANUNCIO (PROPIETARIO)
     ========================================================================= -->
@if (app.showOwnerDeleteModal(); as isOpen) {
@if (app.ownerDeletingRoom; as room) {
<div class="modal-backdrop" (click)="app.closeOwnerDeleteRoomModal()">
  <div class="modal-dialog modal-sm animate-scale-up" (click)="$event.stopPropagation()">
    <button class="modal-close" (click)="app.closeOwnerDeleteRoomModal()"><i class="fa-solid fa-xmark"></i></button>

    <div class="modal-body text-center" style="padding-top: 1.5rem;">
      <div class="delete-warning-icon">
        <i class="fa-solid fa-triangle-exclamation text-rose"></i>
      </div>
      <h3 class="delete-modal-title">¿Quitar esta Publicación?</h3>
      <p class="delete-modal-desc">
        Estás a punto de retirar el anuncio <strong>"{{ room.title }}"</strong> (ID: {{ room.id }}). Los inquilinos ya no podrán verla ni solicitar reservas.
      </p>

      <div class="modal-actions modal-actions-center">
        <button class="btn btn-secondary" (click)="app.closeOwnerDeleteRoomModal()">Cancelar</button>
        <button class="btn btn-danger" [disabled]="app.ownerDeletingLoading" (click)="app.executeOwnerDeleteRoom()">
          @if (app.ownerDeletingLoading) {
          <i class="fa-solid fa-spinner fa-spin"></i> Quitando...
          } @else {
          <i class="fa-solid fa-trash-can"></i> Sí, Quitar Anuncio
          }
        </button>
      </div>
    </div>
  </div>
</div>
}
}
