<!-- =========================================================================
     MODAL: EDITAR PUBLICACIÓN DEL PROPIETARIO
     ========================================================================= -->
@if (app.showOwnerEditModal(); as isOpen) {
@if (app.ownerEditingRoom; as room) {
<div class="modal-backdrop" (click)="app.closeOwnerEditRoomModal()">
  <div class="modal-dialog modal-md animate-scale-up" (click)="$event.stopPropagation()">
    <button class="modal-close" (click)="app.closeOwnerEditRoomModal()"><i class="fa-solid fa-xmark"></i></button>

    <div class="modal-header">
      <h2><i class="fa-solid fa-pen-to-square text-primary"></i> Editar Publicación {{ room.id }}</h2>
      <p>Modifica los datos de tu habitación publicada en Roomix Abancay.</p>
    </div>

    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Título de la Publicación *</label>
        <input type="text" class="form-input" [(ngModel)]="app.ownerEditTitle"
          placeholder="Ej. Habitación amoblada cerca a la UNAMBA">
      </div>

      <div class="form-group">
        <label class="form-label">Descripción</label>
        <textarea class="form-textarea" [(ngModel)]="app.ownerEditDescription" rows="3"
          placeholder="Detalles de la habitación, servicios incluidos, reglas del inmueble..."></textarea>
      </div>

      @if (app.isForSale(app.ownerEditingRoom)) {
      <div class="form-group">
        <label class="form-label">Precio de venta (S/) *</label>
        <input type="number" class="form-input" [(ngModel)]="app.ownerEditSalePrice" min="1" step="1000">
      </div>
      } @else {
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Precio Mensual (S/.) *</label>
          <input type="number" class="form-input" [(ngModel)]="app.ownerEditPrice" min="50" step="10">
        </div>
        <div class="form-group">
          <label class="form-label">Garantía (S/.)</label>
          <input type="number" class="form-input" [(ngModel)]="app.ownerEditDeposit" min="0" step="10">
        </div>
      </div>
      }

      <div class="form-group">
        <label class="form-label">Tipo de inmueble</label>
        <select class="form-select" [(ngModel)]="app.ownerEditType">
          @for (type of app.roomTypeOptions; track type.value) {
            @if (!app.isForSale(app.ownerEditingRoom) || type.allowsSale) {
              <option [value]="type.value">{{ type.label }} · {{ type.audience }}</option>
            }
          }
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Servicios Incluidos</label>
        <div class="checkbox-group-grid">
          <label class="checkbox-option">
            <input type="checkbox" [(ngModel)]="app.ownerEditBathroom">
            <span><i class="fa-solid fa-bath text-primary"></i> Baño Privado</span>
          </label>
          <label class="checkbox-option">
            <input type="checkbox" [(ngModel)]="app.ownerEditWifi">
            <span><i class="fa-solid fa-wifi text-primary"></i> WiFi Fibra Óptica</span>
          </label>
          <label class="checkbox-option">
            <input type="checkbox" [(ngModel)]="app.ownerEditPets">
            <span><i class="fa-solid fa-paw text-primary"></i> Acepta Mascotas</span>
          </label>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">URL de la Foto Principal</label>
        <input type="text" class="form-input" [(ngModel)]="app.ownerEditMainImageUrl"
          placeholder="https://ejemplo.com/foto.jpg">
        @if (app.ownerEditMainImageUrl) {
        <div class="img-preview-box mt-2">
          <img [src]="app.ownerEditMainImageUrl" alt="Vista previa" class="img-preview-thumb"
            (error)="$any($event.target).style.display='none'">
        </div>
        }
      </div>

      <div class="modal-actions">
        <button class="btn btn-secondary" (click)="app.closeOwnerEditRoomModal()">Cancelar</button>
        <button class="btn btn-primary" [disabled]="app.ownerEditSaving" (click)="app.saveOwnerEditRoom()">
          @if (app.ownerEditSaving) {
          <i class="fa-solid fa-spinner fa-spin"></i> Guardando...
          } @else {
          <i class="fa-solid fa-floppy-disk"></i> Guardar Cambios
          }
        </button>
      </div>
    </div>
  </div>
</div>
}
}
