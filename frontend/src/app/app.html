<!-- ==========================================================================
     ROOMIX ABANCAY - WEB APP CONTAINER
     Plataforma modular de alquiler de cuartos en la Provincia de Abancay, Apurímac
     Arquitectura basada en componentes desacoplados y limpios
     ========================================================================== -->

<div class="app-layout">

  <!-- ==================== NOTIFICACIONES Y MENSAJES TOAST ==================== -->
  <app-toast></app-toast>

  <!-- ==================== BARRA DE NAVEGACIÓN SUPERIOR ==================== -->
  <app-navbar></app-navbar>

  <!-- ==================== MENÚ LATERAL RESPONSIVE (DRAWER) ==================== -->
  <app-mobile-nav-drawer></app-mobile-nav-drawer>

  <!-- ==================== CONTENEDOR DE VISTAS PRINCIPALES ==================== -->
  <main class="main-content">
    @if (activeTab() === 'explore') {
      <app-landing-page></app-landing-page>
    }

    @if (activeTab() === 'my-bookings') {
      <app-tenant-dashboard></app-tenant-dashboard>
    }

    @if (activeTab() === 'owner-panel') {
      <app-owner-dashboard></app-owner-dashboard>
    }

    @if (activeTab() === 'admin-panel') {
      <app-admin-dashboard></app-admin-dashboard>
    }
  </main>

  <!-- ==================== MODALES Y DIÁLOGOS DE INTERACCIÓN ==================== -->
  <app-room-detail-modal></app-room-detail-modal>
  <app-booking-modal></app-booking-modal>
  <app-publish-room-modal></app-publish-room-modal>
  <app-review-modal></app-review-modal>
  <app-edit-location-modal></app-edit-location-modal>
  <app-admin-edit-room-modal></app-admin-edit-room-modal>
  <app-admin-delete-room-modal></app-admin-delete-room-modal>
  <app-owner-edit-room-modal></app-owner-edit-room-modal>
  <app-owner-delete-room-modal></app-owner-delete-room-modal>
  <app-mp-receipt-modal></app-mp-receipt-modal>
  <app-edit-profile-modal></app-edit-profile-modal>
  <app-settings-modal></app-settings-modal>
  <app-auth-modal></app-auth-modal>

  <!-- ==================== PIE DE PÁGINA ==================== -->
  <app-footer></app-footer>

</div>
